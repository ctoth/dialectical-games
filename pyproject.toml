[project]
name = "dialectical-games"
version = "0.1.0"
description = "Game-agnostic dialectical argumentation engine core, extracted from dialectical-checkers and dialectical-chess"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ctoth" },
]
keywords = [
    "argumentation",
    "formal-argumentation",
    "dialectical-reasoning",
    "game-ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "formal-argumentation @ git+https://github.com/ctoth/argumentation.git@d47c87003afdce450bfeff10f242309c510f1690",
    "doxa @ git+https://github.com/ctoth/doxa.git@8ba6968f3c40c963786fae504a1719b02b2d17d0",
]

[project.urls]
Homepage = "https://github.com/ctoth/dialectical-games"
Repository = "https://github.com/ctoth/dialectical-games"
Issues = "https://github.com/ctoth/dialectical-games/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/dialectical_games"]

[tool.pyright]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
include = ["src/dialectical_games", "tests"]
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: focused unit-level contract tests",
    "property: property-based or metamorphic tests",
    "differential: differential or oracle-comparison tests",
]

[dependency-groups]
dev = [
    "hypothesis>=6.0",
    "pyright>=1.1.390",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]
